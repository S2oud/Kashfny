name: Gulf Talent AI - live API check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gulf-talent-health.yml"
      - "gulf-talent-ai/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose Worker reachability and CORS without secrets
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, sys
          url = "https://gulftalent.saud3690.workers.dev/health"
          outputs=[]
          for label,headers in (
            ("direct",{"Accept":"application/json","User-Agent":"GulfTalentAI-HealthCheck/1.0 (S2oud/Kashfny)"}),
            ("browser-origin",{"Origin":"https://s2oud.github.io","Accept":"application/json","User-Agent":"GulfTalentAI-HealthCheck/1.0 (S2oud/Kashfny)"})):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                status=r.status
                body=r.read(1500).decode("utf-8","replace")
                cors=r.headers.get("Access-Control-Allow-Origin","")
                server=r.headers.get("Server","")
            except urllib.error.HTTPError as e:
              status=e.code
              body=e.read(1500).decode("utf-8","replace")
              cors=e.headers.get("Access-Control-Allow-Origin","")
              server=e.headers.get("Server","")
            except Exception as e:
              print(label, "request failed:",type(e).__name__,str(e))
              outputs.append(False)
              continue
            print(label,"status:",status,"CORS:",repr(cors),"server:",server,"body:",body[:500])
            try: data=json.loads(body)
            except Exception: data={}
            outputs.append(status==200 and data.get("ok") is True and data.get("tavily") is True and (label!="browser-origin" or cors=="https://s2oud.github.io"))
          if all(outputs):
            print("PASS: Worker deployed with Tavily runtime secret.")
          else:
            print("FAIL: Worker deployment, runtime secrets or CORS need correction.")
            sys.exit(1)
          PY
