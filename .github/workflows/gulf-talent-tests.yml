name: Gulf Talent AI - regression tests

on:
  pull_request:
    paths:
      - "gulf-talent-ai/**"
      - ".github/workflows/gulf-talent-tests.yml"
  push:
    branches: [main]
    paths:
      - "gulf-talent-ai/**"
      - ".github/workflows/gulf-talent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Gulf Talent AI tests without paid API calls
        run: node --test gulf-talent-ai/*.test.mjs
