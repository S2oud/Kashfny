name = "gulftalent"
main = "./worker.js"
workers_dev = true
compatibility_date = "2026-11-06"

[vars]
ALLOWED_ORIGIN = "https://s2oud.github.io,https://gulftalent.saud3690.workers.dev"

[build]
command = "node build-assets.mjs"

[assets]
directory = "./.site-assets"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "DAILY_QUOTA"
class_name = "DailyQuota"

[[migrations]]
tag = "v1-daily-quota"
new_sqlite_classes = ["DailyQuota"]
